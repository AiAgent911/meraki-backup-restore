name: Build Release

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:


jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install meraki pyinstaller

      - name: Build .exe with PyInstaller
        run: pyinstaller meraki_backup.spec --clean

      - name: List output
        run: Get-ChildItem -Recurse dist/

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerakiBackupRestore_exe
          path: dist/MerakiBackupRestore.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install meraki pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller meraki_backup.spec --clean
          mv dist/MerakiBackupRestore RSITServices_MerakiBackupRestore_Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerakiBackupRestore_Linux
          path: dist/RSITServices_MerakiBackupRestore_Linux
          retention-days: 30
